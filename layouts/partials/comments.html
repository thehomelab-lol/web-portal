{{- $giscus := .Site.Params.giscus -}}
{{- if and $giscus $giscus.repo }}
<script src="https://giscus.app/client.js"
    data-repo="{{ $giscus.repo }}"
    data-repo-id="{{ $giscus.repoId }}"
    data-category="{{ $giscus.category }}"
    data-category-id="{{ $giscus.categoryId }}"
    data-mapping="{{ $giscus.mapping | default "pathname" }}"
    data-strict="{{ $giscus.strict | default "0" }}"
    data-reactions-enabled="{{ $giscus.reactionsEnabled | default "1" }}"
    data-emit-metadata="{{ $giscus.emitMetadata | default "0" }}"
    data-input-position="{{ $giscus.inputPosition | default "bottom" }}"
    data-theme="{{ $giscus.darkTheme | default "dark" }}"
    data-lang="{{ $giscus.lang | default "en" }}"
    data-loading="lazy"
    crossorigin="anonymous"
    async>
</script>

<script>
    const GISCUS_LIGHT = "{{ $giscus.lightTheme | default "light" }}";
    const GISCUS_DARK  = "{{ $giscus.darkTheme  | default "dark" }}";

    function setGiscusTheme(theme) {
        const iframe = document.querySelector("iframe.giscus-frame");
        if (!iframe) return;
        iframe.contentWindow.postMessage({ giscus: { setConfig: { theme } } }, "https://giscus.app");
    }

    function currentTheme() {
        return document.documentElement.classList.contains("dark") ? GISCUS_DARK : GISCUS_LIGHT;
    }

    new MutationObserver(() => setGiscusTheme(currentTheme()))
        .observe(document.documentElement, { attributes: true, attributeFilter: ["class"] });

    document.addEventListener("DOMContentLoaded", () => setGiscusTheme(currentTheme()));
</script>
{{- end }}
