<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200">
  <defs>
    <pattern id="blue-lines" x="0" y="0" width="256" height="256" patternUnits="userSpaceOnUse">
      <line x1="-256" y1="512" x2="512" y2="-256" stroke="#38bdf8" stroke-width="3"/>
      <line x1="0"    y1="512" x2="512" y2="0"    stroke="#38bdf8" stroke-width="3"/>
      <line x1="256"  y1="512" x2="512" y2="256"  stroke="#38bdf8" stroke-width="3"/>
    </pattern>
    <pattern id="orange-lines" x="0" y="0" width="256" height="256" patternUnits="userSpaceOnUse">
      <line x1="-128" y1="512" x2="512" y2="-128" stroke="#fb923c" stroke-width="3"/>
      <line x1="128"  y1="512" x2="512" y2="128"  stroke="#fb923c" stroke-width="3"/>
    </pattern>
    <pattern id="deep-blue-lines" x="0" y="0" width="256" height="256" patternUnits="userSpaceOnUse">
      <line x1="-192" y1="512" x2="512" y2="-192" stroke="#818cf8" stroke-width="2"/>
      <line x1="64"   y1="512" x2="512" y2="64"   stroke="#818cf8" stroke-width="2"/>
    </pattern>
  </defs>

  <!-- Sky blue — slow -->
  <g opacity="1">
    <animateTransform attributeName="transform" type="translate"
      values="0 0;-256 256" keyTimes="0;1" dur="18s" repeatCount="indefinite"/>
    <rect width="1600" height="1600" x="-256" y="-256" fill="url(#blue-lines)"/>
  </g>

  <!-- Orange — medium -->
  <g opacity="1">
    <animateTransform attributeName="transform" type="translate"
      values="-64 64;-320 320" keyTimes="0;1" dur="12s" repeatCount="indefinite"/>
    <rect width="1600" height="1600" x="-256" y="-256" fill="url(#orange-lines)"/>
  </g>

  <!-- Indigo — fast -->
  <g opacity="0.9">
    <animateTransform attributeName="transform" type="translate"
      values="-128 128;-384 384" keyTimes="0;1" dur="7s" repeatCount="indefinite"/>
    <rect width="1600" height="1600" x="-256" y="-256" fill="url(#deep-blue-lines)"/>
  </g>
</svg>
