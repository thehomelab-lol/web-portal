baseURL = "https://thehomelab.lol/"
defaultContentLanguage = "en"
enableRobotsTXT = true

[outputs]
  home = ["HTML", "RSS", "JSON"]
[pagination]
  pagerSize = 10

[module]
  [[module.imports]]
    path = "github.com/nunocoracao/blowfish/v2"
    [[module.imports.mounts]]
      source = "assets"
      target = "assets"
    [[module.imports.mounts]]
      source = "i18n"
      target = "i18n"
    [[module.imports.mounts]]
      source = "layouts"
      target = "layouts"
    [[module.imports.mounts]]
      source = "static"
      target = "static"
  [[module.imports]]
    path = "github.com/KKKZOZ/hugo-admonitions"
    [[module.imports.mounts]]
      source = "assets"
      target = "assets"
    [[module.imports.mounts]]
      source = "layouts"
      target = "layouts"

[markup]
  [markup.highlight]
    noClasses = true
    style = "dracula"
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

[languages]
  [languages.en]
    languageName = "English"
    weight = 1
    title = "TheHomeLab"

    [languages.en.params]
      description = "Everything as Code. Self-hosting, Docker, homelab infrastructure, and 3D printing."

      [languages.en.params.author]
        name = "TheHomeLab"
        headline = "Build, Break...Figure it out?"
        bio = ""
        links = [
          { name = "github", url = "https://github.com/thehomelab/stack-lab" },
          { name = "code", url = "https://github.com/thehomelab-lol/lab-stacks" },
          { name = "youtube", url = "https://youtube.com/@thehomelablol" },
          { name = "linkedin", url = "https://www.linkedin.com/in/davidrusho" },
        ]

[params]
  colorScheme = "slate"
  defaultAppearance = "dark"
  autoSwitchAppearance = true
  enableSearch = true
  enableCodeCopy = true
  mainSections = ["blog", "guides"]

  [params.homepage]
    layout = "background"
    homepageImage = "img/background.svg"
    showRecent = true
    showRecentItems = 6
    showMoreLink = true
    showMoreLinkDest = "/blog"

  [params.article]
    showDate = true
    showReadingTime = true
    showTableOfContents = true
    showEdit = true
    editURL = "https://github.com/thehomelab-lol/web-portal/edit/main/content"
    editAppendPath = true
    showBreadcrumbs = true
    showComments = true

  [params.list]
    showSummary = true
    showBreadcrumbs = true
    groupByYear = false

  [params.footer]
    showCopyright = true

  [params.comments]
    provider = "giscus"

  [params.giscus]
    repo = "thehomelab-lol/web-portal"
    repoId = "R_kgDOQf7Sww"
    category = "Announcements"
    categoryId = "DIC_kwDOQf7Sw84CzRay"
    mapping = "pathname"
    strict = "0"
    reactionsEnabled = "1"
    emitMetadata = "0"
    inputPosition = "top"
    lang = "en"
    lightTheme = "catppuccin_latte"
    darkTheme = "catppuccin_frappe"

[menu]
  [[menu.main]]
    identifier = "blog"
    name = "Blog"
    url = "/blog/"
    weight = 10
  [[menu.main]]
    identifier = "guides"
    name = "Guides"
    url = "/guides/"
    weight = 20
  [[menu.main]]
    identifier = "gear"
    name = "Gear"
    url = "/gear/"
    weight = 30
  [[menu.main]]
    identifier = "stack"
    name = "Stack"
    url = "/stack/"
    weight = 40
  [[menu.main]]
    identifier = "about"
    name = "About"
    url = "/about/"
    weight = 50
  [[menu.main]]
    identifier = "sponsor"
    name = "Sponsor"
    url = "/sponsor/"
    weight = 60
